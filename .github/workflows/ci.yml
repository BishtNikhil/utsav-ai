name: UtsavAI Enterprise CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx

    - name: Execute Automated Test Matrix
      run: |
        python -m pytest tests/ -v --junitxml=test-results.xml

    - name: Enforce Zero-Secret Security Compliance
      run: |
        # Verify no production API keys or credentials are committed in repository
        ! git grep -i "AIzaSy" -- ':!tests' ':!.env.example'
        echo "Zero-Secret Policy: Verified clean."
